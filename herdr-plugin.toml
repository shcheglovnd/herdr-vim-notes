id = "shcheglovnd.herdr-vim-notes"
name = "Herdr Vim Notes"
version = "0.1.0"
description = "Persistent Markdown notes for each tab, edited in a right-hand Vim split."
min_herdr_version = "0.9.5"
platforms = ["linux", "macos"]

[[actions]]
id = "open-notes"
title = "Open tab notes in Vim"
contexts = ["global", "workspace"]
command = ["python3", "./tab_notes.py", "open"]
